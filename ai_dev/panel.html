<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 开发助手</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#18212b;background:#f3f5f7;letter-spacing:0;--line:#dce2e7;--muted:#687581;--brand:#2563eb;--panel:#fff;--soft:#eef4ff;--danger:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f5f7}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:248px minmax(0,1fr) 300px;height:100vh}.side,.activity{background:var(--panel);min-height:0;display:flex;flex-direction:column}.side{border-right:1px solid var(--line)}.activity{border-left:1px solid var(--line)}.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:750}.logo{width:32px;height:32px;border-radius:7px;background:#18212b;color:#fff;display:grid;place-items:center}.new{margin:14px;border:1px solid #b9c7da;border-radius:7px;background:#fff;color:#174ea6;padding:9px 12px;font-weight:650;cursor:pointer}.sessions,.events{overflow:auto;min-height:0;padding:0 10px 14px}.session{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:6px;padding:9px 10px;text-align:left;cursor:pointer;color:#394653}.session.active{background:var(--soft);color:#174ea6}.session span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.session .del{opacity:.5;border:0;background:transparent;cursor:pointer}.main{min-width:0;min-height:0;display:flex;flex-direction:column}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px}.top h1{font-size:16px;margin:0;white-space:nowrap}.grow{flex:1}.select{height:36px;min-width:150px;max-width:230px;border:1px solid #cbd4db;border-radius:6px;background:#fff;padding:0 9px}.icon{width:36px;height:36px;border:1px solid #cbd4db;border-radius:6px;background:#fff;cursor:pointer;display:grid;place-items:center}.mobile{display:none}.state{font-size:12px;color:var(--muted)}.state.ok{color:#087443}.messages{flex:1;overflow:auto;padding:24px max(20px,calc((100% - 860px)/2))}.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center}.message{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;margin-bottom:20px}.avatar{width:32px;height:32px;border-radius:6px;background:#dfe7ef;display:grid;place-items:center;font-size:12px;font-weight:750}.message.assistant .avatar{background:#18212b;color:#fff}.bubble{line-height:1.65;white-space:pre-wrap;word-break:break-word}.composer{background:#fff;border-top:1px solid var(--line);padding:14px max(16px,calc((100% - 860px)/2)) 18px}.compose{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:end;border:1px solid #cbd4db;border-radius:8px;padding:8px;background:#fff}.compose textarea{border:0;outline:0;resize:none;min-height:38px;max-height:180px;padding:8px;background:transparent}.send{height:38px;border:0;border-radius:6px;background:var(--brand);color:#fff;padding:0 16px;font-weight:650;cursor:pointer}.thumbs{display:flex;gap:8px;margin-bottom:8px}.thumb{position:relative}.thumb img{width:58px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}.thumb button{position:absolute;right:-5px;top:-5px;border:0;border-radius:50%;background:#222;color:#fff;width:18px;height:18px;cursor:pointer}.activity h2{font-size:14px;margin:0;padding:22px 16px;border-bottom:1px solid var(--line)}.event{border-bottom:1px solid var(--line);padding:11px 8px;font-size:12px}.event b{display:block;margin-bottom:4px}.event pre{white-space:pre-wrap;word-break:break-word;margin:5px 0 0;color:var(--muted);font-family:ui-monospace,monospace}.notice{margin:12px;padding:10px;border:1px solid #f0c9c5;background:#fff5f4;color:var(--danger);border-radius:6px;font-size:12px}.backdrop{display:none;position:fixed;inset:0;background:#0005;z-index:20}.toast{position:fixed;right:18px;bottom:18px;background:#18212b;color:#fff;padding:10px 14px;border-radius:6px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:none}@media(max-width:1050px){.app{grid-template-columns:220px minmax(0,1fr)}.activity{position:fixed;right:0;top:0;bottom:0;width:min(320px,88vw);z-index:30;transform:translateX(100%);transition:.2s}.activity.open{transform:none}.mobile.activity-btn{display:grid}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:min(280px,88vw);z-index:30;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.mobile{display:grid}.top{padding:0 10px}.top h1{display:none}.select{min-width:0;max-width:none;flex:1}.state{display:none}.messages{padding:18px 14px}.composer{padding:10px}.compose{grid-template-columns:auto minmax(0,1fr) auto}.compose .mode{grid-column:1/-1;width:100%}.backdrop.show{display:block}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"><div class="brand"><span class="logo">AI</span>开发助手</div><button class="new" id="new">新建对话</button><div class="sessions" id="sessions"></div></aside>
  <main class="main">
    <header class="top"><button class="icon mobile" id="menu" title="会话">☰</button><h1>AI 开发助手</h1><select class="select" id="provider" title="插件使用的接口"><option value="">自动接口</option></select><select class="select" id="model" title="插件使用的模型"><option value="">自动模型</option></select><span class="grow"></span><span class="state" id="state">连接中</span><button class="icon mobile activity-btn" id="activityBtn" title="实时活动">☷</button></header>
    <section class="messages" id="messages"><div class="empty">新建或选择会话后开始对话</div></section>
    <footer class="composer"><div class="thumbs" id="thumbs"></div><div class="compose"><button class="icon" id="attach" title="添加图片">＋</button><select class="select mode" id="mode"><option value="dev">插件开发</option><option value="chat">普通对话</option></select><textarea id="input" rows="1" placeholder="向 AI 描述要完成的开发任务"></textarea><button class="send" id="send">发送</button></div><input id="files" type="file" accept="image/*" multiple hidden></footer>
  </main>
  <aside class="activity" id="activity"><h2>实时工具活动</h2><div class="events" id="events"></div></aside>
</div>
<div class="backdrop" id="backdrop"></div><div class="toast" id="toast"></div>
<script>
const byId=id=>document.getElementById(id);const token=new URLSearchParams(location.search).get('token')||localStorage.getItem('token')||'';let cfg={},sid=localStorage.getItem('ai_dev_sid')||'',images=[],source;
function showToast(value){const node=byId('toast');node.textContent=value;node.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>node.classList.remove('show'),2500)}
async function api(path,options={}){options.headers={...(options.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};const response=await fetch('/api/ext/aidev'+path,options);if(response.status===401)throw new Error('登录已失效，请返回后台重新登录');const data=await response.json();if(data.success===false)throw new Error(data.error||data.message||'请求失败');return data}
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function providers(){return (cfg.shared_ai?.providers||[]).filter(item=>item.enabled)}
function renderSelectors(){const list=providers();byId('provider').innerHTML='<option value="">自动接口（按优先级）</option>'+list.map(item=>'<option value="'+esc(item.id)+'">'+esc(item.name)+'</option>').join('');byId('provider').value=list.some(item=>item.id===cfg.provider_id)?cfg.provider_id:'';const provider=list.find(item=>item.id===byId('provider').value);const models=provider?(provider.models||[]).filter(item=>!(provider.disabled_models||[]).includes(item)):[];byId('model').innerHTML='<option value="">自动模型（按优先级）</option>'+models.map(item=>'<option value="'+esc(item)+'">'+esc(item)+'</option>').join('');byId('model').value=models.includes(cfg.model_preference)?cfg.model_preference:''}
async function saveSelection(){const data=await api('/config',{method:'POST',body:JSON.stringify({provider_id:byId('provider').value,model_preference:byId('model').value})});cfg=data.config;renderSelectors();showToast('调用偏好已保存')}
async function loadConfig(){const data=await api('/config');cfg=data.config||{};renderSelectors();byId('state').textContent=cfg.shared_ai_available?'中央 AI LLM 已连接':'中央 AI LLM 未启用';byId('state').className='state'+(cfg.shared_ai_available?' ok':'');if(!cfg.shared_ai_available)showToast('请先启用并配置 ai_llm 模块')}
async function loadSessions(){const data=await api('/sessions');const list=(data.sessions||[]).filter(item=>!item.id.startsWith('qq_'));byId('sessions').innerHTML=list.map(item=>'<button class="session '+(item.id===sid?'active':'')+'" data-id="'+esc(item.id)+'"><span>'+esc(item.title||'新对话')+'</span><b class="del" title="删除">×</b></button>').join('')||'<div class="notice">暂无会话</div>';document.querySelectorAll('.session').forEach(button=>button.onclick=async event=>{if(event.target.classList.contains('del')){event.stopPropagation();await api('/sessions/delete',{method:'POST',body:JSON.stringify({session_id:button.dataset.id})});if(sid===button.dataset.id)sid='';await loadSessions();return}sid=button.dataset.id;localStorage.setItem('ai_dev_sid',sid);await loadHistory();await loadSessions();closeDrawers()})}
function bubble(role,content){return '<article class="message '+role+'"><span class="avatar">'+(role==='assistant'?'AI':'你')+'</span><div class="bubble">'+esc(content)+'</div></article>'}
async function loadHistory(){if(!sid){byId('messages').innerHTML='<div class="empty">新建或选择会话后开始对话</div>';return}const data=await api('/history?session_id='+encodeURIComponent(sid));byId('messages').innerHTML=(data.messages||[]).map(item=>bubble(item.role,item.content)).join('')||'<div class="empty">开始第一条消息</div>';byId('messages').scrollTop=byId('messages').scrollHeight;renderEvents(data.events||[])}
async function createSession(){const data=await api('/sessions',{method:'POST',body:'{}'});sid=data.session.id;localStorage.setItem('ai_dev_sid',sid);await loadSessions();await loadHistory();closeDrawers();byId('input').focus()}
function renderThumbs(){byId('thumbs').innerHTML=images.map((url,index)=>'<span class="thumb"><img src="'+url+'" alt="附件"><button data-i="'+index+'">×</button></span>').join('');document.querySelectorAll('.thumb button').forEach(button=>button.onclick=()=>{images.splice(Number(button.dataset.i),1);renderThumbs()})}
function renderEvents(items){byId('events').innerHTML=items.slice().reverse().map(item=>'<div class="event"><b>'+esc(item.type||'事件')+'</b><pre>'+esc(JSON.stringify(item.data||item,null,2).slice(0,1200))+'</pre></div>').join('')||'<div class="notice">发送消息后显示工具调用和执行结果</div>'}
async function send(){const text=byId('input').value.trim();if(!text&&!images.length)return;if(!sid)await createSession();byId('send').disabled=true;byId('messages').insertAdjacentHTML('beforeend',bubble('user',text||'[图片]')+bubble('assistant','正在处理...'));byId('messages').scrollTop=byId('messages').scrollHeight;try{await api('/chat',{method:'POST',body:JSON.stringify({session_id:sid,message:text,images,mode:byId('mode').value,model:byId('model').value})});byId('input').value='';images=[];renderThumbs();await loadHistory();await loadSessions()}catch(error){showToast(error.message);await loadHistory()}finally{byId('send').disabled=false}}
function connect(){if(source)source.close();source=new EventSource('/api/ext/aidev/stream?token='+encodeURIComponent(token));source.onmessage=async()=>{if(sid){const data=await api('/history?session_id='+encodeURIComponent(sid));renderEvents(data.events||[])}}}
function closeDrawers(){byId('side').classList.remove('open');byId('activity').classList.remove('open');byId('backdrop').classList.remove('show')}
byId('provider').onchange=async()=>{cfg.provider_id=byId('provider').value;cfg.model_preference='';renderSelectors();await saveSelection()};byId('model').onchange=saveSelection;byId('new').onclick=createSession;byId('send').onclick=send;byId('input').onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}};byId('attach').onclick=()=>byId('files').click();byId('files').onchange=()=>{[...byId('files').files].slice(0,8-images.length).forEach(file=>{const reader=new FileReader();reader.onload=()=>{images.push(reader.result);renderThumbs()};reader.readAsDataURL(file)});byId('files').value=''};byId('menu').onclick=()=>{byId('side').classList.add('open');byId('backdrop').classList.add('show')};byId('activityBtn').onclick=()=>{byId('activity').classList.add('open');byId('backdrop').classList.add('show')};byId('backdrop').onclick=closeDrawers;
(async()=>{try{await loadConfig();await loadSessions();await loadHistory();connect()}catch(error){showToast(error.message);byId('state').textContent='连接失败'}})();
</script>
</body>
</html>
