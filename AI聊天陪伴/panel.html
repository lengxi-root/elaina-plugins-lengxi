<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 陪伴</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#20252b;background:#f4f6f7;letter-spacing:0;--line:#dfe4e7;--muted:#68727c;--blue:#2563eb;--green:#087443;--red:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f6f7}.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:16px}.brand-icon{width:30px;height:30px;display:grid;place-items:center;background:#20252b;color:#fff;border-radius:6px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#505a64;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;font:inherit}.nav button.active{background:#edf3ff;color:#174ea6;font-weight:650}.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top h1{font-size:18px;margin:0}.actions{display:flex;gap:8px}.content{max-width:1120px;padding:22px 24px 40px}.page{display:none}.page.active{display:block}.section{padding:18px 0;border-bottom:1px solid var(--line)}.section:first-child{padding-top:0}.section h2{font-size:14px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,select,textarea{width:100%;min-height:38px;border:1px solid #ccd3d8;border-radius:6px;background:#fff;padding:8px 10px;font:inherit;color:inherit}textarea{min-height:100px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid var(--line);padding:11px 12px;border-radius:6px}.toggle input{width:18px;min-height:auto;height:18px;accent-color:var(--blue)}.toggle b{font-size:13px}.btn{min-height:36px;border:1px solid #cbd3d8;border-radius:6px;background:#fff;padding:7px 12px;cursor:pointer;font:inherit;font-weight:600}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red);border-color:#efc5c1}.btn.icon{width:36px;padding:0;font-size:18px}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.item-head strong{font-size:13px}.badge{font-size:11px;padding:2px 7px;border-radius:10px;background:#edf3ff;color:#174ea6}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{background:#fff;border:1px solid var(--line);padding:14px;border-radius:6px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:4px}.status{position:fixed;right:20px;bottom:20px;max-width:420px;padding:10px 14px;background:#20252b;color:#fff;border-radius:6px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.status.show{opacity:1;transform:none}.status.error{background:var(--red)}.test-box{display:grid;grid-template-columns:1fr auto;gap:8px}.result{margin-top:12px;background:#fff;border:1px solid var(--line);padding:14px;border-radius:6px;white-space:pre-wrap;min-height:70px}.empty{color:var(--muted);text-align:center;padding:28px}@media(max-width:820px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}.brand{padding-bottom:10px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;padding:8px 4px}.top{padding:0 14px}.content{padding:18px 14px}.grid,.grid-3,.stats{grid-template-columns:1fr 1fr}}@media(max-width:540px){.grid,.grid-3,.stats{grid-template-columns:1fr}.top{height:auto;min-height:64px;gap:8px}.actions .btn:not(.primary){display:none}.nav button{font-size:12px}}
@media(max-width:820px){.nav{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="brand-icon">AI</span><span>聊天陪伴</span></div>
    <nav class="nav">
      <button class="active" data-page="overview">总览</button>
      <button data-page="providers">AI 服务</button>
      <button data-page="personalities">人格</button>
      <button data-page="safety">安全</button>
      <button data-page="test">测试</button>
    </nav>
  </aside>
  <main class="main">
    <header class="top"><h1 id="title">总览</h1><div class="actions"><button class="btn" id="reload">刷新</button><button class="btn primary" id="save">保存</button></div></header>
    <div class="content">
      <section class="page active" id="page-overview">
        <div class="section"><h2>运行状态</h2><div class="stats"><div class="stat"><span>会话</span><b id="stat-conversations">-</b></div><div class="stat"><span>消息</span><b id="stat-messages">-</b></div><div class="stat"><span>群聊</span><b id="stat-groups">-</b></div><div class="stat"><span>私聊</span><b id="stat-directs">-</b></div></div></div>
        <div class="section"><h2>触发范围</h2><div class="grid"><label class="toggle"><b>启用插件</b><input type="checkbox" id="enabled"></label><label class="toggle"><b>启用群聊</b><input type="checkbox" id="group_enabled"></label><label class="toggle"><b>全量群聊概率回复</b><input type="checkbox" id="group_auto_reply"></label><label class="toggle"><b>记录群聊消息</b><input type="checkbox" id="record_group_messages"></label><label class="toggle"><b>启用私聊</b><input type="checkbox" id="direct_enabled"></label><label class="toggle"><b>启用 AI 输出审核</b><input type="checkbox" id="audit_enabled"></label></div></div>
        <div class="section"><h2>当前配置</h2><div class="grid grid-3"><div class="field"><label>AI 接口</label><select id="provider_id"></select></div><div class="field"><label>AI 模型</label><select id="model_preference"></select></div><div class="field"><label>活动人格</label><select id="active_personality"></select></div></div></div>
        <div class="section"><h2>全量群聊</h2><div class="grid grid-3"><div class="field"><label>自动回复概率（%）</label><input type="number" id="group_reply_probability" min="0" max="100" step="0.1"></div><div class="field"><label>每群回复冷却（秒）</label><input type="number" id="group_reply_cooldown_seconds" min="0" max="86400"></div><div class="field"><label>群聊参考消息数</label><input type="number" id="group_history_messages" min="2" max="200"></div></div></div>
        <div class="section"><h2>生成与上下文</h2><div class="grid grid-3"><div class="field"><label>Temperature</label><input type="number" id="temperature" min="0" max="2" step="0.1"></div><div class="field"><label>最大输出 Token</label><input type="number" id="max_tokens" min="1" max="131072"></div><div class="field"><label>私聊上下文消息数</label><input type="number" id="context_messages" min="2" max="200"></div><div class="field"><label>上下文过期（秒）</label><input type="number" id="context_expire_seconds" min="0"></div><div class="field"><label>每会话最多存储</label><input type="number" id="max_stored_messages" min="20" max="10000"></div></div><div class="actions" style="margin-top:14px"><button class="btn danger" id="clear-context">清空全部上下文</button></div></div>
      </section>
      <section class="page" id="page-providers"><div class="section"><h2>中央 AI 服务</h2><div class="list" id="provider-list"></div></div></section>
      <section class="page" id="page-personalities"><div class="section"><h2>人格列表</h2><div class="list" id="personality-list"></div><div class="actions" style="margin-top:12px"><button class="btn" id="add-personality">添加人格</button></div></div></section>
      <section class="page" id="page-safety"><div class="section"><h2>联网工具</h2><div class="grid"><label class="toggle"><b>允许 AI 使用公网搜索与网页读取</b><input type="checkbox" id="network_tools_enabled"></label><div class="field"><label>最大工具轮数</label><input type="number" id="network_tool_rounds" min="1" max="6"></div></div><div class="field" style="margin-top:14px"><label>网页读取域名白名单（每行一个）</label><textarea id="network_allowed_domains"></textarea></div></div><div class="section"><h2>输出审核</h2><div class="grid"><label class="toggle"><b>群聊启用审核</b><input type="checkbox" id="audit_on_group"></label><label class="toggle"><b>私聊启用审核</b><input type="checkbox" id="audit_on_direct"></label><label class="toggle"><b>审核失败时阻断回复</b><input type="checkbox" id="audit_fail_closed"></label><div class="field"><label>审核超时（秒）</label><input type="number" id="audit_timeout" min="3" max="120"></div></div><div class="field" style="margin-top:14px"><label>审核拦截回复</label><textarea id="audit_blocked_response"></textarea></div></div><div class="section"><h2>内容安全</h2><div class="field"><label>违规词（每行一个或逗号分隔）</label><textarea id="blocked_words"></textarea></div><div class="field"><label>拦截回复</label><textarea id="blocked_response"></textarea></div></div></section>
      <section class="page" id="page-test"><div class="section"><h2>连接测试</h2><div class="grid"><div class="field"><label>接口 / 模型</label><input id="test-provider" readonly></div><div class="field"><label>人格</label><select id="test-personality"></select></div></div><div class="field" style="margin-top:14px"><label>消息</label><div class="test-box"><input id="test-message" value="你好，请用一句话确认连接成功。"><button class="btn primary" id="run-test">发送</button></div></div><div class="result" id="test-result">等待测试</div></div></section>
    </div>
  </main>
</div>
<div class="status" id="status"></div>
<script>
const API='/api/ext/ai-companion';let state=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message,error=false){const el=$('status');el.textContent=message;el.className='status show'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.className='status',2800)}
async function api(path,options){const response=await fetch(API+path,options);const data=await response.json();if(!data.success)throw new Error(data.error||'请求失败');return data.data}
function providerTemplate(item,index){const enabled=(item.models||[]).filter(model=>!(item.disabled_models||[]).includes(model));return `<article class="item"><div class="item-head"><strong>${index+1}. ${esc(item.name)}</strong><span class="badge">优先级 ${Number(item.priority??0)}</span></div><div class="grid"><div class="field"><label>默认模型</label><input readonly value="${esc(item.model||'-')}"></div><div class="field"><label>启用模型</label><input readonly value="${enabled.length}"></div></div></article>`}
function personalityTemplate(id,item){return `<article class="item personality-item"><div class="item-head"><strong>${esc(item.name||id)}</strong>${item.builtin?'<span class="badge">内置</span>':'<button class="btn danger remove-personality" type="button">删除</button>'}</div><div class="grid"><div class="field"><label>ID</label><input data-key="id" value="${esc(id)}" ${item.builtin?'readonly':''}></div><div class="field"><label>名称</label><input data-key="name" value="${esc(item.name)}"></div></div><div class="field" style="margin-top:12px"><label>系统提示词</label><textarea data-key="prompt">${esc(item.prompt)}</textarea></div><input data-key="builtin" type="hidden" value="${item.builtin?'1':''}"></article>`}
function sharedProviders(){return (state.shared_ai?.providers||[]).filter(item=>item.enabled)}
function fillModels(){const provider=sharedProviders().find(item=>item.id===$('provider_id').value);const models=provider?(provider.models||[]).filter(model=>!(provider.disabled_models||[]).includes(model)):[];$('model_preference').innerHTML='<option value="">自动选择（按模型优先级）</option>'+models.map(model=>`<option value="${esc(model)}">${esc(model)}</option>`).join('');$('model_preference').value=models.includes(state.model_preference)?state.model_preference:'';const p=$('provider_id').selectedOptions[0]?.textContent||'自动选择';const m=$('model_preference').selectedOptions[0]?.textContent||'自动选择';$('test-provider').value=`${p} / ${m}`}
function bindRemove(){document.querySelectorAll('.remove-personality').forEach(button=>button.onclick=()=>button.closest('.personality-item').remove())}
function render(){['enabled','group_enabled','group_auto_reply','record_group_messages','direct_enabled','network_tools_enabled','audit_enabled','audit_on_group','audit_on_direct','audit_fail_closed'].forEach(key=>$(key).checked=!!state[key]);['temperature','max_tokens','context_messages','group_history_messages','context_expire_seconds','max_stored_messages','group_reply_probability','group_reply_cooldown_seconds','network_tool_rounds','audit_timeout'].forEach(key=>$(key).value=state[key]);$('network_allowed_domains').value=(state.network_allowed_domains||[]).join('\n');$('blocked_words').value=(state.blocked_words||[]).join('\n');$('blocked_response').value=state.blocked_response||'';$('audit_blocked_response').value=state.audit_blocked_response||'';const providers=sharedProviders();$('provider-list').innerHTML=providers.map(providerTemplate).join('')||'<div class="empty">中央 AI 模块未启用或没有可用接口</div>';$('provider_id').innerHTML='<option value="">自动选择（按接口优先级）</option>'+providers.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');$('provider_id').value=providers.some(x=>x.id===state.provider_id)?state.provider_id:'';$('personality-list').innerHTML=Object.entries(state.personalities).map(([id,item])=>personalityTemplate(id,item)).join('');const personalityOptions=Object.entries(state.personalities).map(([id,x])=>`<option value="${esc(id)}">${esc(x.name)}</option>`).join('');$('active_personality').innerHTML=personalityOptions;$('active_personality').value=state.active_personality;$('test-personality').innerHTML=personalityOptions;$('test-personality').value=state.active_personality;fillModels();bindRemove()}
function collect(){const personalities={};document.querySelectorAll('.personality-item').forEach(el=>{const item={};el.querySelectorAll('[data-key]').forEach(input=>item[input.dataset.key]=input.value.trim());const id=item.id;delete item.id;item.builtin=item.builtin==='1';personalities[id]=item});return {...state,provider_id:$('provider_id').value,model_preference:$('model_preference').value,enabled:$('enabled').checked,group_enabled:$('group_enabled').checked,group_auto_reply:$('group_auto_reply').checked,record_group_messages:$('record_group_messages').checked,direct_enabled:$('direct_enabled').checked,network_tools_enabled:$('network_tools_enabled').checked,skills_enabled:$('skills_enabled').checked,audit_enabled:$('audit_enabled').checked,audit_on_group:$('audit_on_group').checked,audit_on_direct:$('audit_on_direct').checked,audit_fail_closed:$('audit_fail_closed').checked,active_personality:$('active_personality').value,temperature:Number($('temperature').value),max_tokens:Number($('max_tokens').value),context_messages:Number($('context_messages').value),group_history_messages:Number($('group_history_messages').value),context_expire_seconds:Number($('context_expire_seconds').value),max_stored_messages:Number($('max_stored_messages').value),group_reply_probability:Number($('group_reply_probability').value),group_reply_cooldown_seconds:Number($('group_reply_cooldown_seconds').value),network_tool_rounds:Number($('network_tool_rounds').value),audit_timeout:Number($('audit_timeout').value),network_allowed_domains:$('network_allowed_domains').value,blocked_words:$('blocked_words').value,audit_blocked_response:$('audit_blocked_response').value.trim(),blocked_response:$('blocked_response').value.trim(),personalities}}
async function load(){state=await api('/config');render();const stats=await api('/stats');$('stat-conversations').textContent=stats.conversations;$('stat-messages').textContent=stats.messages;$('stat-groups').textContent=stats.group_conversations;$('stat-directs').textContent=stats.direct_conversations}
async function save(){state=await api('/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(collect())});render();toast('配置已保存')}
document.querySelectorAll('.nav button').forEach(button=>button.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+button.dataset.page));$('title').textContent=button.textContent});$('provider_id').onchange=()=>{state.provider_id=$('provider_id').value;state.model_preference='';fillModels()};$('model_preference').onchange=()=>{state.model_preference=$('model_preference').value;fillModels()};$('reload').onclick=()=>load().then(()=>toast('已刷新')).catch(e=>toast(e.message,true));$('save').onclick=()=>save().catch(e=>toast(e.message,true));$('add-personality').onclick=()=>{$('personality-list').insertAdjacentHTML('beforeend',personalityTemplate('custom-'+Date.now(),{name:'新人格',prompt:'',builtin:false}));bindRemove()};$('clear-context').onclick=async()=>{if(!confirm('确定清空全部群聊和私聊上下文？'))return;try{const data=await api('/context',{method:'DELETE',headers:{'Content-Type':'application/json'},body:'{}'});toast(`已清空 ${data.deleted} 条消息`);await load()}catch(e){toast(e.message,true)}};$('run-test').onclick=async()=>{const button=$('run-test');button.disabled=true;$('test-result').textContent='请求中...';try{const data=await api('/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({personality_id:$('test-personality').value,message:$('test-message').value})});$('test-result').textContent=data.reply}catch(e){$('test-result').textContent=e.message}finally{button.disabled=false}};load().catch(e=>toast(e.message,true));
const personalityPage=$('page-personalities');
personalityPage.insertAdjacentHTML('beforeend','<div class="section"><h2>LLM Skills</h2><label class="toggle"><b>允许模型按需加载本地技能</b><input type="checkbox" id="skills_enabled"></label><div class="list" id="skills-list" style="margin-top:12px"></div></div>');
async function loadSkills(){if(!state){setTimeout(loadSkills,200);return;}const enabledToggle=$('skills_enabled');enabledToggle.checked=!!state.skills_enabled;enabledToggle.onchange=()=>state.skills_enabled=enabledToggle.checked;try{const items=await api('/skills');$('skills-list').innerHTML=items.map(item=>`<label class="toggle"><span><b>${esc(item.name)}</b><small style="display:block;color:var(--muted);margin-top:3px">${esc(item.description)}</small></span><input type="checkbox" data-skill-id="${esc(item.id)}" ${item.enabled?'checked':''}></label>`).join('')||'<div class="empty">未发现 SKILL.md</div>';document.querySelectorAll('[data-skill-id]').forEach(input=>input.onchange=()=>{state.enabled_skills=[...document.querySelectorAll('[data-skill-id]:checked')].map(item=>item.dataset.skillId);});}catch(error){$('skills-list').innerHTML=`<div class="empty">${esc(error.message)}</div>`;}}
loadSkills();
</script>
</body>
</html>
