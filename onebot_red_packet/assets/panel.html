<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QQ 抢红包</title>
  <style>
    :root{
      --host-bg:#f5f7fa;--host-bg2:#fff;--host-bg3:#f0f2f5;--host-bg-float:#fff;
      --host-text:#20242c;--host-text2:#5b6472;--host-text3:#8a93a1;--host-border:#e3e7ed;
      --host-accent:#6366f1;--host-accent-hover:#5558dd;--host-accent-light:#e7e8ff;
      --host-success:#18a058;--host-danger:#d03050;--host-warning:#f0a020;--host-info:#2080f0;
      --page:var(--host-bg);--surface:var(--host-bg2);--soft:var(--host-bg3);--float:var(--host-bg-float);
      --text:var(--host-text);--text2:var(--host-text2);--text3:var(--host-text3);--line:var(--host-border);
      --accent:var(--host-accent);--accent-hover:var(--host-accent-hover);--accent-light:var(--host-accent-light);
      --success:var(--host-success);--danger:var(--host-danger);--warning:var(--host-warning);--info:var(--host-info);
      --accent-soft:var(--host-accent-soft,color-mix(in srgb,var(--accent) 11%,transparent));
      --accent-line:color-mix(in srgb,var(--accent) 34%,var(--line));
      --success-soft:color-mix(in srgb,var(--success) 12%,transparent);
      --danger-soft:color-mix(in srgb,var(--danger) 10%,transparent);
      --shadow:0 1px 2px color-mix(in srgb,var(--text) 5%,transparent),0 7px 20px color-mix(in srgb,var(--text) 4%,transparent);
      color-scheme:var(--host-color-scheme,light);
    }
    @media(prefers-color-scheme:dark){:root:not([data-host-theme]){
      --host-bg:#121419;--host-bg2:#1b1e25;--host-bg3:#242832;--host-bg-float:#20242c;
      --host-text:#edf0f5;--host-text2:#b6bdc9;--host-text3:#858e9d;--host-border:#343a46;
      --host-accent:#8b8df8;--host-accent-hover:#a1a3ff;--host-accent-light:#30325a;
      --host-success:#63c792;--host-danger:#ef7188;--host-warning:#e8b75b;--host-info:#70adf5;--host-color-scheme:dark}}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--page)}
    body{margin:0;min-width:280px;background:var(--page);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}button{color:inherit}svg{display:block}
    ::selection{background:var(--accent-soft)}
    ::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text3) 36%,transparent);border-radius:4px}
    .shell{width:min(1180px,100%);margin:auto;padding:24px 28px 44px}
    .page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
    .title-group{display:flex;align-items:center;gap:12px;min-width:0}.title-icon{width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--accent-line);border-radius:8px;background:var(--accent-soft);color:var(--accent)}.title-icon svg{width:21px;height:21px}
    h1{margin:0;font-size:20px;line-height:1.25;font-weight:720;letter-spacing:0}.subtitle{margin-top:3px;color:var(--text3);font-size:12px}
    .head-actions,.section-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.head-actions{justify-content:flex-end}
    .status-pill{height:34px;display:inline-flex;align-items:center;gap:7px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text2);white-space:nowrap}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);box-shadow:0 0 0 3px color-mix(in srgb,var(--text3) 13%,transparent)}.status-dot.on{background:var(--success);box-shadow:0 0 0 3px var(--success-soft)}
    .btn{height:34px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text2);font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s}.btn svg{width:15px;height:15px}.btn:hover:not(:disabled){border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}.btn:active:not(:disabled){transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 22%,transparent)}.btn.primary:hover:not(:disabled){border-color:var(--accent-hover);background:var(--accent-hover);color:#fff}.btn.danger{border-color:color-mix(in srgb,var(--danger) 28%,var(--line));background:var(--danger-soft);color:var(--danger)}.btn.danger:hover:not(:disabled){border-color:var(--danger);background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{position:relative;min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}.stat:after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent)}.stat-label{display:flex;align-items:center;gap:6px;color:var(--text3);font-size:11px;font-weight:600}.stat-label svg{width:14px;height:14px;color:var(--accent)}.stat-value{margin-top:6px;overflow:hidden;font-size:21px;font-weight:720;font-variant-numeric:tabular-nums;text-overflow:ellipsis;white-space:nowrap}.stat-value.money{color:var(--accent)}
    .content-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}.panel{min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow)}.panel.wide{grid-column:1/-1}.panel-head{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}.panel-heading{display:flex;align-items:center;gap:10px;min-width:0}.panel-icon{width:30px;height:30px;display:grid;place-items:center;flex:0 0 auto;border-radius:7px;background:var(--accent-soft);color:var(--accent)}.panel-icon svg{width:16px;height:16px}.panel-title{margin:0;font-size:14px;line-height:1.3;font-weight:680}.panel-note{margin-top:2px;color:var(--text3);font-size:10.5px}.panel-body{padding:16px}
    .switch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px}.switch-row{min-height:52px;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--soft);cursor:pointer;transition:border-color .15s,background .15s}.switch-row:hover{border-color:var(--accent-line);background:var(--accent-soft)}.switch-copy{min-width:0;flex:1}.switch-title{display:block;font-size:12px;font-weight:620}.switch-desc{display:block;margin-top:1px;color:var(--text3);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.switch{position:relative;width:34px;height:19px;flex:0 0 auto}.switch input{position:absolute;opacity:0;pointer-events:none}.switch-track{position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--text3) 35%,var(--line));border-radius:999px;background:color-mix(in srgb,var(--text3) 20%,var(--surface));transition:background .18s,border-color .18s}.switch-track:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--float);box-shadow:0 1px 3px color-mix(in srgb,var(--text) 26%,transparent);transition:transform .18s}.switch input:checked+.switch-track{border-color:var(--accent);background:var(--accent)}.switch input:checked+.switch-track:after{transform:translateX(15px);background:#fff}.switch input:focus-visible+.switch-track{outline:3px solid var(--accent-soft);outline-offset:2px}
    .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;min-width:0;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{color:var(--text2);font-size:11.5px;font-weight:620}.field-hint{color:var(--text3);font-size:10px}input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;outline:0;background:var(--soft);color:var(--text);transition:border-color .15s,box-shadow .15s,background .15s}input,select{height:36px;padding:0 10px}textarea{min-height:76px;padding:8px 10px;line-height:1.55;resize:vertical}input::placeholder,textarea::placeholder{color:var(--text3)}input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--accent) 36%,var(--line))}input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}select{cursor:pointer}option{background:var(--float);color:var(--text)}
    .filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}.filter-column{min-width:0}.filter-column-title{display:flex;align-items:center;gap:7px;margin-bottom:9px;color:var(--text2);font-size:11px;font-weight:680}.filter-column-title:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}.filter-column .field+.field{margin-top:10px}
    .account-list{display:grid;gap:7px}.account{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}.account-id{min-width:0;overflow:hidden;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-overflow:ellipsis;white-space:nowrap}.account-toggle{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:11px;cursor:pointer}.info-list{display:grid;gap:10px;margin:0;padding:0;list-style:none}.info-item{display:flex;align-items:flex-start;gap:9px;color:var(--text2);font-size:11.5px}.info-item svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px;color:var(--accent)}.command-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.command{padding:3px 7px;border:1px solid var(--line);border-radius:5px;background:var(--soft);color:var(--text2);font:10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .table-wrap{width:100%;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11.5px}th,td{height:40px;padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}th{height:36px;background:var(--soft);color:var(--text3);font-size:10.5px;font-weight:650}tbody tr:last-child td{border-bottom:0}tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}.result-badge{display:inline-flex;align-items:center;min-height:22px;padding:2px 7px;border-radius:5px;background:var(--soft);color:var(--text2);font-size:10.5px;font-weight:650}.result-badge.success{background:var(--success-soft);color:var(--success)}.empty{padding:24px 12px;text-align:center;color:var(--text3);font-size:11.5px}
    .toast{position:fixed;z-index:50;left:50%;bottom:22px;max-width:min(360px,calc(100vw - 32px));padding:9px 14px;border:1px solid var(--line);border-radius:7px;background:var(--float);color:var(--text);box-shadow:0 10px 30px color-mix(in srgb,var(--text) 20%,transparent);opacity:0;pointer-events:none;transform:translate(-50%,10px);transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{border-color:color-mix(in srgb,var(--danger) 35%,var(--line));color:var(--danger)}
    @media(max-width:900px){.shell{padding:20px 18px 36px}.content-grid{grid-template-columns:1fr}.panel.wide{grid-column:auto}}
    @media(max-width:680px){.shell{padding:14px 12px 28px}.page-head{align-items:flex-start;flex-direction:column}.head-actions{width:100%;justify-content:flex-start}.status-pill{margin-right:auto}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.switch-grid,.fields,.filter-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel-head{align-items:flex-start}.panel-head.has-actions{flex-direction:column}.panel-head.has-actions .section-actions{width:100%}th,td{padding-left:10px;padding-right:10px}}
    @media(max-width:420px){.title-icon{width:36px;height:36px}h1{font-size:18px}.head-actions .btn{flex:1}.status-pill{width:100%;justify-content:center}.stat{padding:12px}.stat-value{font-size:18px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="page-head">
    <div class="title-group"><div class="title-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 5v14"/><path d="M14.5 13.5h3M16 12v3"/></svg></div><div><h1>QQ 抢红包</h1><div class="subtitle">领取策略、账号开关与运行记录</div></div></div>
    <div class="head-actions"><div class="status-pill"><span id="statusDot" class="status-dot"></span><span id="statusText">状态加载中</span></div><button id="reload" class="btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>刷新</button><button id="save" class="btn primary" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>保存配置</button></div>
  </header>
  <section id="stats" class="stats" aria-label="红包统计"><div class="stat"><div class="stat-label">累计次数</div><div class="stat-value">--</div></div><div class="stat"><div class="stat-label">累计金额</div><div class="stat-value money">--</div></div><div class="stat"><div class="stat-label">今日次数</div><div class="stat-value">--</div></div><div class="stat"><div class="stat-label">今日金额</div><div class="stat-value money">--</div></div></section>
  <div class="content-grid">
    <section class="panel"><div class="panel-head"><div class="panel-heading"><div class="panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg></div><div><h2 class="panel-title">领取策略</h2><div class="panel-note">红包类型与行为控制</div></div></div></div><div class="panel-body">
      <div class="switch-grid">
        <label class="switch-row"><span class="switch-copy"><span class="switch-title">默认启用</span><span class="switch-desc">新账号继承此状态</span></span><span class="switch"><input id="enabled" type="checkbox"><span class="switch-track"></span></span></label>
        <label class="switch-row"><span class="switch-copy"><span class="switch-title">仅通知</span><span class="switch-desc">识别后不实际领取</span></span><span class="switch"><input id="notifyOnly" type="checkbox"><span class="switch-track"></span></span></label>
        <label class="switch-row"><span class="switch-copy"><span class="switch-title">普通红包</span><span class="switch-desc">领取普通红包</span></span><span class="switch"><input id="grabNormal" type="checkbox"><span class="switch-track"></span></span></label>
        <label class="switch-row"><span class="switch-copy"><span class="switch-title">专属红包</span><span class="switch-desc">领取可领取的专属红包</span></span><span class="switch"><input id="grabExclusive" type="checkbox"><span class="switch-track"></span></span></label>
        <label class="switch-row"><span class="switch-copy"><span class="switch-title">口令红包</span><span class="switch-desc">识别口令红包</span></span><span class="switch"><input id="grabPassword" type="checkbox"><span class="switch-track"></span></span></label>
        <label class="switch-row"><span class="switch-copy"><span class="switch-title">自动发送口令</span><span class="switch-desc">按需发送红包口令</span></span><span class="switch"><input id="autoPassword" type="checkbox"><span class="switch-track"></span></span></label>
        <label class="switch-row"><span class="switch-copy"><span class="switch-title">跳过管理员</span><span class="switch-desc">忽略群主和管理员红包</span></span><span class="switch"><input id="skipAdmin" type="checkbox"><span class="switch-track"></span></span></label>
      </div>
      <div class="fields"><div class="field"><label for="delayMin">最小延迟（ms）</label><input id="delayMin" type="number" min="0"></div><div class="field"><label for="delayMax">最大延迟（ms）</label><input id="delayMax" type="number" min="0"></div><div class="field"><label for="passwordWait">口令等待（ms）</label><input id="passwordWait" type="number" min="0"></div><div class="field"><label for="pauseMinutes">领取后暂停（分钟）</label><input id="pauseMinutes" type="number" min="0"></div><div class="field full"><label for="blockKeywords">全局屏蔽词</label><input id="blockKeywords" placeholder="多个关键词用逗号分隔"></div></div>
    </div></section>
    <section class="panel"><div class="panel-head"><div class="panel-heading"><div class="panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div><h2 class="panel-title">时间与通知</h2><div class="panel-note">停止时段与领取反馈</div></div></div></div><div class="panel-body">
      <div class="switch-grid"><label class="switch-row"><span class="switch-copy"><span class="switch-title">启用停止时段</span><span class="switch-desc">指定时段暂停领取</span></span><span class="switch"><input id="stopByTime" type="checkbox"><span class="switch-track"></span></span></label><label class="switch-row"><span class="switch-copy"><span class="switch-title">领取后感谢</span><span class="switch-desc">领取成功后发送感谢</span></span><span class="switch"><input id="thanksEnabled" type="checkbox"><span class="switch-track"></span></span></label><label class="switch-row"><span class="switch-copy"><span class="switch-title">发送领取通知</span><span class="switch-desc">将结果推送至目标会话</span></span><span class="switch"><input id="notifyOwner" type="checkbox"><span class="switch-track"></span></span></label></div>
      <div class="fields"><div class="field"><label for="stopStart">开始时间</label><input id="stopStart" type="time"></div><div class="field"><label for="stopEnd">结束时间</label><input id="stopEnd" type="time"></div><div class="field"><label for="thanksDelay">感谢延迟（ms）</label><input id="thanksDelay" type="number" min="0"></div><div class="field"><label for="masterQQ">主人 QQ</label><input id="masterQQ" inputmode="numeric"></div><div class="field full"><label for="thanksMessages">感谢消息</label><textarea id="thanksMessages" placeholder="每行一条，发送时随机选择"></textarea></div><div class="field"><label for="notifyTarget">通知目标</label><input id="notifyTarget" inputmode="numeric"></div><div class="field"><label for="notifyType">通知类型</label><select id="notifyType"><option value="private">私聊</option><option value="group">群聊</option></select></div></div>
    </div></section>
    <section class="panel wide"><div class="panel-head"><div class="panel-heading"><div class="panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg></div><div><h2 class="panel-title">过滤规则</h2><div class="panel-note">按群、用户和关键词限定领取范围</div></div></div></div><div class="panel-body">
      <div class="fields" style="margin-bottom:16px"><div class="field"><label for="groupMode">过滤模式</label><select id="groupMode"><option value="none">不过滤</option><option value="whitelist">白名单</option><option value="blacklist">黑名单</option></select></div><div class="field"><label for="historyLimit">历史记录上限</label><input id="historyLimit" type="number" min="20" max="5000"></div></div>
      <div class="filter-grid"><div class="filter-column"><div class="filter-column-title">白名单</div><div class="field"><label for="whiteGroups">群号</label><input id="whiteGroups" placeholder="多个群号用逗号分隔"></div><div class="field"><label for="whiteUsers">用户 QQ</label><input id="whiteUsers" placeholder="多个 QQ 用逗号分隔"></div><div class="field"><label for="whiteKeywords">关键词</label><input id="whiteKeywords" placeholder="多个关键词用逗号分隔"></div></div><div class="filter-column"><div class="filter-column-title">黑名单</div><div class="field"><label for="blackGroups">群号</label><input id="blackGroups" placeholder="多个群号用逗号分隔"></div><div class="field"><label for="blackUsers">用户 QQ</label><input id="blackUsers" placeholder="多个 QQ 用逗号分隔"></div><div class="field"><label for="blackKeywords">关键词</label><input id="blackKeywords" placeholder="多个关键词用逗号分隔"></div></div></div>
    </div></section>
    <section class="panel"><div class="panel-head"><div class="panel-heading"><div class="panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div><div><h2 class="panel-title">账号开关</h2><div class="panel-note">覆盖单个内置 QQ 的启用状态</div></div></div></div><div id="accounts" class="panel-body account-list"><div class="empty">账号设置加载中</div></div></section>
    <section class="panel"><div class="panel-head"><div class="panel-heading"><div class="panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></div><div><h2 class="panel-title">运行说明</h2><div class="panel-note">内置 QQ 原生红包接口</div></div></div></div><div class="panel-body"><ul class="info-list"><li class="info-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg><span>未单独配置的账号继承“默认启用”状态。</span></li><li class="info-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg><span>插件仅处理框架内置 QQ 上报的红包事件。</span></li></ul><div class="command-list"><span class="command">红包开启</span><span class="command">红包关闭</span><span class="command">红包状态</span></div></div></section>
    <section class="panel wide"><div class="panel-head has-actions"><div class="panel-heading"><div class="panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 4-7"/></svg></div><div><h2 class="panel-title">最近记录</h2><div class="panel-note">最多展示最近 100 条记录</div></div></div><div class="section-actions"><button id="resetStats" class="btn danger" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg>清空统计与历史</button></div></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>账号</th><th>群</th><th>发送者</th><th>结果</th><th>金额</th></tr></thead><tbody id="history"><tr><td colspan="6" class="empty">记录加载中</td></tr></tbody></table></div></section>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
  const API='/api/ext/red-packet';
  const THEME_MAP={'--bg':'--host-bg','--bg2':'--host-bg2','--bg3':'--host-bg3','--bg-float':'--host-bg-float','--text':'--host-text','--text2':'--host-text2','--text3':'--host-text3','--border':'--host-border','--accent':'--host-accent','--accent-hover':'--host-accent-hover','--accent-light':'--host-accent-light','--accent-soft':'--host-accent-soft','--success':'--host-success','--danger':'--host-danger','--warning':'--host-warning','--info':'--host-info'};
  function hostColorScheme(style){const declared=String(style.colorScheme||'').toLowerCase();if(declared==='dark'||declared.startsWith('dark only'))return'dark';if(declared==='light'||declared.startsWith('light only'))return'light';const probe=document.createElement('span');probe.style.cssText='position:fixed;visibility:hidden;color:'+(style.getPropertyValue('--bg').trim()||'#fff');document.body.appendChild(probe);const rgb=getComputedStyle(probe).color.match(/[\d.]+/g);probe.remove();return rgb&&rgb.length>=3&&(.2126*Number(rgb[0])+.7152*Number(rgb[1])+.0722*Number(rgb[2]))<128?'dark':'light'}
  function syncHostTheme(){try{if(window.parent===window)return;const hostStyle=window.parent.getComputedStyle(window.parent.document.documentElement);const rootStyle=document.documentElement.style;Object.entries(THEME_MAP).forEach(function(entry){const value=hostStyle.getPropertyValue(entry[0]).trim();if(value)rootStyle.setProperty(entry[1],value)});const scheme=hostColorScheme(hostStyle);rootStyle.setProperty('--host-color-scheme',scheme);rootStyle.colorScheme=scheme;document.documentElement.dataset.hostTheme=scheme}catch(_){}}
  syncHostTheme();if(window.parent!==window){const themeSyncTimer=window.setInterval(syncHostTheme,300);window.addEventListener('pagehide',function(){window.clearInterval(themeSyncTimer)},{once:true})}
  const el=function(id){return document.getElementById(id)};let current={};let toastTimer;
  function toast(text,error){const node=el('toast');clearTimeout(toastTimer);node.textContent=text;node.className='toast show'+(error?' error':'');toastTimer=setTimeout(function(){node.className='toast'},2300)}
  async function request(path,options){const response=await fetch(API+path,options);const data=await response.json();if(!response.ok||data.success===false)throw new Error(data.error||'请求失败');return data}
  function split(text){return text.split(',').map(function(item){return item.trim()}).filter(Boolean)}
  function set(id,value){const node=el(id);if(node.type==='checkbox')node.checked=!!value;else node.value=value==null?'':value}
  function render(state){current=state;const s=state.settings;set('enabled',s.enabled);set('notifyOnly',s.notify_only);set('grabNormal',s.grab_normal);set('grabExclusive',s.grab_exclusive);set('grabPassword',s.grab_password);set('autoPassword',s.auto_send_password);set('skipAdmin',s.skip_admin_owner);set('delayMin',s.delay_min_ms);set('delayMax',s.delay_max_ms);set('passwordWait',s.password_wait_ms);set('pauseMinutes',s.pause_group_minutes);set('blockKeywords',(s.block_keywords||[]).join(','));set('stopByTime',s.stop_by_time);set('stopStart',s.stop_start_time);set('stopEnd',s.stop_end_time);set('thanksEnabled',s.thanks_reply_enabled);set('thanksDelay',s.thanks_delay_ms);set('thanksMessages',(s.thanks_messages||[]).join('\n'));set('notifyOwner',s.notify_owner);set('notifyTarget',s.notify_target);set('notifyType',s.notify_target_type);set('masterQQ',s.master_qq);set('groupMode',s.group_mode);set('historyLimit',s.history_limit);set('whiteGroups',(s.whitelist_groups||[]).join(','));set('blackGroups',(s.blacklist_groups||[]).join(','));set('whiteUsers',(s.whitelist_users||[]).join(','));set('blackUsers',(s.blacklist_users||[]).join(','));set('whiteKeywords',(s.whitelist_keywords||[]).join(','));set('blackKeywords',(s.blacklist_keywords||[]).join(','));el('statusDot').classList.toggle('on',!!s.enabled);el('statusText').textContent=s.enabled?'默认领取已开启':'默认领取已关闭';renderStats(state.stats||{});renderAccounts(state.accounts||{});renderHistory(state.history||[])}
  function statIcon(type){return type==='money'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 8 4 4 4-4M12 12v5M9 15h6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7h12M8 12h12M8 17h12"/><circle cx="4" cy="7" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="17" r="1" fill="currentColor" stroke="none"/></svg>'}
  function renderStats(stats){let count=0,total=0,todayCount=0,todayAmount=0;Object.values(stats).forEach(function(item){count+=Number(item.success_count||0);total+=Number(item.total_amount||0);todayCount+=Number(item.today_count||0);todayAmount+=Number(item.today_amount||0)});const items=[['累计次数',String(count),'count',false],['累计金额','¥'+total.toFixed(2),'money',true],['今日次数',String(todayCount),'count',false],['今日金额','¥'+todayAmount.toFixed(2),'money',true]];el('stats').innerHTML=items.map(function(item){return '<div class="stat"><div class="stat-label">'+statIcon(item[2])+item[0]+'</div><div class="stat-value'+(item[3]?' money':'')+'">'+item[1]+'</div></div>'}).join('')}
  function renderAccounts(accounts){el('accounts').innerHTML='';const entries=Object.entries(accounts);if(!entries.length){el('accounts').innerHTML='<div class="empty">尚无账号级设置</div>';return}entries.forEach(function(entry){const id=entry[0],item=entry[1],row=document.createElement('div');row.className='account';row.innerHTML='<span class="account-id"></span><label class="account-toggle"><span>启用</span><span class="switch"><input type="checkbox"><span class="switch-track"></span></span></label>';row.querySelector('.account-id').textContent=id;const input=row.querySelector('input');input.checked=item.enabled!==false;input.onchange=async function(){try{await request('/account',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({self_id:id,enabled:input.checked})});toast('账号设置已保存')}catch(error){input.checked=!input.checked;toast(error.message,true)}};el('accounts').appendChild(row)})}
  function renderHistory(history){el('history').innerHTML='';const rows=[...history].reverse().slice(0,100);if(!rows.length){el('history').innerHTML='<tr><td colspan="6" class="empty">暂无记录</td></tr>';return}rows.forEach(function(item){const tr=document.createElement('tr');[new Date(item.time*1000).toLocaleString(),item.self_id,item.group_name||item.group_id||'私聊',item.sender_name||item.sender_id].forEach(function(text){const td=document.createElement('td');td.textContent=text;tr.appendChild(td)});const resultTd=document.createElement('td'),badge=document.createElement('span');badge.className='result-badge'+(item.success?' success':'');badge.textContent=item.success?'成功':(item.skipped||item.error||'失败');resultTd.appendChild(badge);tr.appendChild(resultTd);const amountTd=document.createElement('td');amountTd.textContent=item.success?'¥'+Number(item.amount||0).toFixed(2):'-';tr.appendChild(amountTd);el('history').appendChild(tr)})}
  function collect(){return{enabled:el('enabled').checked,notify_only:el('notifyOnly').checked,grab_normal:el('grabNormal').checked,grab_exclusive:el('grabExclusive').checked,grab_password:el('grabPassword').checked,auto_send_password:el('autoPassword').checked,skip_admin_owner:el('skipAdmin').checked,delay_min_ms:Number(el('delayMin').value||0),delay_max_ms:Number(el('delayMax').value||0),password_wait_ms:Number(el('passwordWait').value||0),pause_group_minutes:Number(el('pauseMinutes').value||0),block_keywords:split(el('blockKeywords').value),stop_by_time:el('stopByTime').checked,stop_start_time:el('stopStart').value||'00:00',stop_end_time:el('stopEnd').value||'00:00',thanks_reply_enabled:el('thanksEnabled').checked,thanks_delay_ms:Number(el('thanksDelay').value||0),thanks_messages:el('thanksMessages').value.split('\n').map(function(x){return x.trim()}).filter(Boolean),notify_owner:el('notifyOwner').checked,notify_target:el('notifyTarget').value.trim(),notify_target_type:el('notifyType').value,master_qq:el('masterQQ').value.trim(),group_mode:el('groupMode').value,history_limit:Number(el('historyLimit').value||300),whitelist_groups:split(el('whiteGroups').value),blacklist_groups:split(el('blackGroups').value),whitelist_users:split(el('whiteUsers').value),blacklist_users:split(el('blackUsers').value),whitelist_keywords:split(el('whiteKeywords').value),blacklist_keywords:split(el('blackKeywords').value)}}
  async function load(){el('reload').disabled=true;try{render((await request('/state')).state)}catch(error){el('statusText').textContent='状态加载失败';toast(error.message,true)}finally{el('reload').disabled=false}}
  el('reload').onclick=load;el('save').onclick=async function(){const button=el('save');button.disabled=true;try{await request('/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(collect())});toast('配置已保存');await load()}catch(error){toast(error.message,true)}finally{button.disabled=false}};el('resetStats').onclick=async function(){if(!confirm('确定清空全部红包统计与历史记录？'))return;const button=el('resetStats');button.disabled=true;try{await request('/statistics',{method:'DELETE'});toast('统计已清空');await load()}catch(error){toast(error.message,true)}finally{button.disabled=false}};load();
</script>
</body>
